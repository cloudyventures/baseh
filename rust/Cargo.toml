[package]
name = "baseh"
version = "1.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "baseH codec: fixed-length, checksummed, optionally permuted human-readable identifiers"

[dependencies]
num-bigint = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1"
