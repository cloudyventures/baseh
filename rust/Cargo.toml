[package]
name = "baseh"
version = "2.0.3"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
description = "baseH codec: fixed-length, checksummed, optionally permuted human-readable identifiers"
repository = "https://github.com/cloudyventures/baseh"
homepage = "https://github.com/cloudyventures/baseh"
documentation = "https://docs.rs/baseh"
readme = "README.md"
keywords = ["baseh", "encoding", "identifier", "checksum", "human-readable"]
categories = ["encoding", "data-structures"]

[dependencies]
num-bigint = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1"
proptest = "1"

# The round-trip soak CI subset (tests/soak.rs) does millions of BigUint
# round trips; unoptimized test builds take minutes instead of the seconds
# the soak spec budgets. Optimize test builds; compile time stays modest.
[profile.test]
opt-level = 2
