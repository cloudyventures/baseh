<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BaseH Code Designer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <h1>BaseH Code Designer</h1>
    <p class="sub">Required capacity in, shortest valid configuration out. <a href="./index.html">Go to the capacity calculator</a>.</p>
  </header>
  <main class="cols designer">
    <section aria-labelledby="req">
      <h2 id="req">Requirements</h2>
      <div class="field">
        <label for="required">Required number of IDs<span class="tip" tabindex="0" aria-label="Required number of IDs details"><span class="i">i</span><span class="tip-body">The number of distinct identifiers this namespace must ever issue. Plain digits or a compact suffix: 6k is 6,000, 6m is 6,000,000, 6b is 6,000,000,000 and 6t is 6,000,000,000,000. When you leave the field the number is restated in the standard display format. Deriving from operational demand (below) uses the larger of the two values.</span></span></label>
        <input id="required" type="text" inputmode="numeric" value="60000000" />
      </div>
      <details>
        <summary>Or derive from operational demand</summary>
        <div class="field">
          <label for="d-records">New records per day</label>
          <input id="d-records" type="number" min="0" />
        </div>
        <div class="field">
          <label for="d-retention">Retention days</label>
          <input id="d-retention" type="number" min="0" />
        </div>
      </details>
      <div class="field">
        <label for="max-len">Maximum displayed length</label>
        <input id="max-len" type="number" min="3" max="20" value="9" />
      </div>
      <div class="field">
        <label for="d-separator">Delimiter<span class="tip" tabindex="0" aria-label="Delimiter details"><span class="i">i</span><span class="tip-body">Optional one-character delimiter inserted between groups of the code, for example a hyphen turning JCG4JUY into JCG4-JUY. An empty value means no delimiter. Each delimiter position counts toward the maximum displayed length, so adding one can push a candidate from feasible to too long. The delimiter never changes capacity or the checksum; it is grouping only, and the character must not be an alphabet symbol.</span></span></label>
        <input id="d-separator" type="text" maxlength="1" value="" placeholder="none" />
      </div>
      <div class="field">
        <label for="min-check">Minimum checksum length<span class="tip" tabindex="0" aria-label="Minimum checksum length details"><span class="i">i</span><span class="tip-body">Rejects every candidate with fewer checksum symbols than this. 0 allows unvalidated codes, where a typo silently matches the wrong record or fails with no explanation. 1 matches assisted-support workflows: about 98.8% of single-symbol substitutions are caught and a human handles the rest (the baseh32-v1 posture). 2 forces self-service strength: provable detection of every single substitution and every adjacent transposition (the baseh32s-v1 posture). 3 exists for very noisy channels.</span></span></label>
        <select id="min-check">
          <option value="0">0</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="field">
        <label for="max-util">Maximum utilization<span class="tip" tabindex="0" aria-label="Maximum utilization details"><span class="i">i</span><span class="tip-body">Hides any candidate whose required capacity exceeds this fraction of its total capacity. Lower values reserve more growth headroom: at 50% you can double demand before you must re-issue a longer code and migrate references. Fuller codes are shorter today but risk exhausting the namespace at exactly the moment the product is succeeding.</span></span></label>
        <select id="max-util">
          <option value="0.5" selected>50%</option>
          <option value="0.7">70%</option>
          <option value="0.8">80%</option>
          <option value="0.9">90%</option>
        </select>
      </div>
      <div class="field">
        <label for="d-visual">Visual safety<span class="tip" tabindex="0" aria-label="Visual safety details"><span class="i">i</span><span class="tip-body">Applied to every alphabet the solver considers: look-alike symbols are excluded so printed codes are harder to misread. None keeps all symbols. Light drops O, I and L (covered by 0 and 1). Medium also drops B and S. Heavy restricts every candidate to the reviewed 32-symbol alphabet, which also drops U. Higher safety shrinks the alphabet, so a candidate may need a longer body to reach your required capacity.</span></span></label>
        <select id="d-visual">
          <option value="none">None</option>
          <option value="light" selected>Light</option>
          <option value="medium">Medium</option>
          <option value="heavy">Heavy</option>
        </select>
      </div>
      <div class="field">
        <label for="d-spoken">Spoken safety<span class="tip" tabindex="0" aria-label="Spoken safety details"><span class="i">i</span><span class="tip-body">For codes read out over the phone. For each sound-alike pair, one letter is removed from the alphabet so it can never appear in a new code, and a code that contains it anyway decodes automatically as the kept letter: no ambiguity, no guessing. Light removes D (decodes as B) and T (decodes as P). Medium also removes N (decodes as M) and W (decodes as V). Heavy also removes S (decodes as F) and G (decodes as C). Pairs run from the most common confusions at Light to the least at Heavy. Each removed letter shrinks the alphabet, so higher levels need either a longer body or accept less capacity, and the solver prices that in automatically.</span></span></label>
        <select id="d-spoken">
          <option value="none">None</option>
          <option value="light" selected>Light</option>
          <option value="medium">Medium</option>
          <option value="heavy">Heavy</option>
        </select>
      </div>
      <div class="field">
        <label for="d-profanity">Profanity<span class="tip" tabindex="0" aria-label="Profanity controls details"><span class="i">i</span><span class="tip-body">Profanity controls keep codes customer-safe. Strip vowels removes A, E, I, O and U from every alphabet so no English word can ever be spelled; it shrinks the alphabet, which lowers capacity and may lengthen the body. Blocklist keeps the full alphabet but refuses to issue or accept any code containing a common English profanity; those identifiers are reserved and skipped, marked as blocked in the examples. None applies no check.</span></span></label>
        <select id="d-profanity">
          <option value="none" selected>None</option>
          <option value="no-vowels">Strip vowels</option>
          <option value="blocklist">Blocklist</option>
        </select>
      </div>
      <fieldset class="field">
        <legend>Allowed alphabets</legend>
        <label class="check"><input id="allow-alnum" type="checkbox" checked /> Alphanumeric</label>
        <label class="check"><input id="allow-upper" type="checkbox" checked /> Letters only</label>
        <label class="check"><input id="allow-digits" type="checkbox" checked /> Digits only</label>
      </fieldset>
      <div class="row">
        <button id="d-export" type="button">Copy export JSON</button>
      </div>
    </section>

    <section aria-labelledby="result" aria-live="polite">
      <h2 id="result">Recommendation</h2>
      <div id="recommended" class="card"></div>
      <div id="repair" role="alert"></div>
      <h3>Alternatives</h3>
      <div id="alternatives"></div>
    </section>

  </main>
  <section class="wide" aria-labelledby="compare">
    <h2 id="compare">Comparisons</h2>
    <table id="candidates">
      <thead>
        <tr><th></th><th>Candidate</th><th>Capacity</th><th>Utilization</th><th>Displayed</th><th>Zero Renders As</th><th>Reason</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
  <script type="module" src="/src/designer.ts"></script>
</body>
</html>
