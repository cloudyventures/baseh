[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baseh"
version = "1.1.0"
description = "baseH codec: checksumed, optionally permuted human-readable identifiers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
