[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base-human"
version = "1.0.0"
description = "HRC (Human Reference Code) codec: checksumed, optionally permuted human-readable identifiers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
