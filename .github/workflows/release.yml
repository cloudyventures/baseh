name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: js vectors
        run: cd js && npm ci && npm test
      - name: python vectors
        run: cd python && python -m unittest discover -s tests
      - name: go vectors
        run: cd go && go test ./...
      - name: rust vectors
        run: cd rust && cargo test --locked
      - name: ruby vectors
        run: cd ruby && rake

  # Publishing uses OIDC trusted publishing; no long-lived registry tokens.
  # Each registry must have cloudyventures/baseh + this workflow registered as
  # a trusted publisher first (see docs/releasing.md).
  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with OIDC trusted publishing support
        run: npm install -g npm@latest
      # The first npm publish is a manual bootstrap (trusted publishers can be
      # configured with less friction on an existing package). That bootstrap
      # lands the same version the tag run publishes, so an already-published
      # version is success here, not a failure.
      - run: |
          npm ci && npm run build
          if npm publish --access public --provenance; then
            echo "published ${{ github.ref_name }}"
          elif npm view "@cloudyventures/baseh@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "version already on npm (bootstrap publish), continuing"
          else
            exit 1
          fi
        working-directory: js

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build && python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # A re-run of the tag (or a repeat tag push) re-attempts the same
          # wheel. Already-on-PyPI is success here, not a failure.
          skip-existing: true

  publish-crates:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The first crates.io publish is a manual bootstrap (trusted publishers
      # can only be configured on an existing crate). That bootstrap lands the
      # same version the tag run publishes, so an already-published version is
      # success here, not a failure.
      - run: |
          set -o pipefail
          if cargo publish --locked 2>&1 | tee publish.log; then
            echo "published ${{ github.ref_name }}"
          elif grep -qi 'already' publish.log; then
            echo "version already on crates.io (bootstrap publish), continuing"
          else
            exit 1
          fi
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-rubygems:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - uses: rubygems/release-gem@v1
        with:
          working-directory: ruby

  tag-go:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag go submodule version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Idempotent so a repeat tag run does not fail: an identical
          # existing tag is left alone, a divergent one is a hard failure.
          if git rev-parse -q --verify "refs/tags/go/${TAG}" >/dev/null; then
            echo "go/${TAG} already exists remotely, leaving as-is"
            exit 0
          fi
          git tag "go/${TAG}"
          git push origin "go/${TAG}"
