name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: js vectors
        run: cd js && npm ci && npm test
      - name: python vectors
        run: cd python && PYTHONPATH=src python -m unittest discover -s tests
      - name: go vectors
        run: cd go && go test ./...
      - name: rust vectors
        run: cd rust && cargo test --locked
      - name: ruby vectors
        run: cd ruby && rake

      # Release gates: full 100,000-sampled-body checksum sweep (spec
      # IMPLEMENTATION_TEST_SUITE.md sections 6.3 and 19) plus a time-boxed
      # Go fuzz run. BASEH_SOAK=1 selects the full sweep; body-count
      # overrides (BASEH_SOAK_CHECKSUM / BASEH_SOAK_BODIES /
      # BASEH_SOAK_CHECKSUM_SWEEP / BASEH_SWEEP_BODIES) are left at their
      # defaults so the spec's 100k count applies.
      # JS has no full-sweep gate: its sweep lives in the normal codec tests
      # with no BASEH_SOAK variant, so there is no JS step here.
      - name: python full checksum sweep
        run: cd python && BASEH_SOAK=1 PYTHONPATH=src python tests/test_checksum_sweep.py TestChecksumSweepFull
      - name: go full checksum sweep
        run: cd go && BASEH_SOAK=1 go test -run TestChecksumSweepFull -v .
      - name: rust full checksum sweep
        run: cd rust && BASEH_SOAK=1 cargo test --release --test checksum_sweep -- --ignored single_substitution_sweep_full --nocapture
      - name: ruby full checksum sweep
        run: cd ruby && BASEH_SOAK=1 ruby -Ilib -Itest test/test_checksum_sweep.rb -n test_single_substitution_sweep_soak
      - name: go fuzz decode (5m time-box)
        run: cd go && go test -fuzz=FuzzDecode -fuzztime=5m .

  # Publishing uses OIDC trusted publishing; no long-lived registry tokens.
  # Each registry must have cloudyventures/baseh + this workflow registered as
  # a trusted publisher first (see docs/releasing.md).
  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with OIDC trusted publishing support
        run: npm install -g npm@latest
      # The first npm publish is a manual bootstrap (trusted publishers can be
      # configured with less friction on an existing package). That bootstrap
      # lands the same version the tag run publishes, so an already-published
      # version is success here, not a failure.
      - run: |
          npm ci && npm run build
          if npm publish --access public --provenance; then
            echo "published ${{ github.ref_name }}"
          elif curl -sf "https://registry.npmjs.org/@cloudyventures%2fbaseh/$(node -p "require('./package.json').version")" >/dev/null; then
            echo "version already on npm (bootstrap publish), continuing"
          else
            exit 1
          fi
        working-directory: js

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build && python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # A re-run of the tag (or a repeat tag push) re-attempts the same
          # wheel. Already-on-PyPI is success here, not a failure.
          skip-existing: true

  publish-crates:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The first crates.io publish is a manual bootstrap (trusted publishers
      # can only be configured on an existing crate). That bootstrap lands the
      # same version the tag run publishes, so an already-published version is
      # success here, not a failure.
      - run: |
          set -o pipefail
          # The log must live outside the crate directory: an untracked
          # publish.log in rust/ makes cargo publish refuse a dirty tree.
          if cargo publish --locked 2>&1 | tee /tmp/publish.log; then
            echo "published ${{ github.ref_name }}"
          elif grep -qi 'already' /tmp/publish.log; then
            echo "version already on crates.io (bootstrap publish), continuing"
          else
            exit 1
          fi
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-rubygems:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      # The first gem push may happen in an earlier run of the same tag;
      # rubygems.org rejects repushes, so skip when the version is live.
      - name: check whether gem version is already live
        id: gemstate
        run: |
          V=$(ruby -e 'require_relative "ruby/lib/baseh/version"; print Baseh::VERSION')
          if curl -sf "https://rubygems.org/api/v1/versions/baseh.json" | grep -q "\"number\":\"$V\""; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rubygems/release-gem@v1
        if: steps.gemstate.outputs.exists == 'false'
        with:
          working-directory: ruby

  tag-go:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag go submodule version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Idempotent so a repeat tag run does not fail: an identical
          # existing tag is left alone, a divergent one is a hard failure.
          if [ -n "$(git ls-remote --tags origin "go/${TAG}")" ]; then
            echo "go/${TAG} already exists remotely, leaving as-is"
            exit 0
          fi
          git tag "go/${TAG}"
          # The Actions token cannot push a ref whose tree touches
          # .github/workflows (no workflows scope on GITHUB_TOKEN). That
          # rejection is tolerated with a warning; push the go tag manually
          # with an SSH key instead (see docs/releasing.md).
          if out=$(git push origin "go/${TAG}" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "workflows"; then
            echo "$out"
            echo "::warning::go/${TAG} push rejected (workflows scope); push it manually: git push origin go/${TAG}"
          else
            echo "$out"
            exit 1
          fi

  # The GitHub Release marks a fully-green release: it only runs once every
  # registry publish and the Go tag have succeeded.
  github-release:
    needs: [verify, publish-npm, publish-pypi, publish-crates, publish-rubygems, tag-go]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
