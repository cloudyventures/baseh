name: pages

# Deploy the site only on release tags, not on every push to main. The
# release workflow's verify job has already run the full gates for the tag,
# so a failing test or type error can never go live.
on:
  push:
    tags: ["v*"]
  # Manual redeploy, for example when a tag predates a pages.yml fix.
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The web tests import js/src directly, so js dependencies must be
      # installed first (same fix as the web job in ci.yml).
      - run: npm ci
        working-directory: js
      # vite build strips types without checking them, so the deploy runs the
      # same gate as local development: tests, then tsc, then the build.
      - run: npm ci && npm test && npx tsc --noEmit && npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
